<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>原型 01 · 封面特刊</title>
    <style>
      :root {
        --bg: #f3f0e8;
        --ink: #1f1c18;
        --muted: #6b6258;
        --accent: #b44e27;
        --panel: rgba(255, 252, 245, 0.9);
        --line: rgba(31, 28, 24, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
        color: var(--ink);
        background: linear-gradient(180deg, #f6f1e8 0%, #efe8dd 100%);
      }

      .proto-bar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        background: rgba(31, 28, 24, 0.92);
        color: #f8f1e8;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      .proto-bar a { color: #f0d2bf; }
      .proto-bar nav { display: flex; gap: 14px; flex-wrap: wrap; }

      .cover {
        position: relative;
        min-height: min(78vh, 720px);
        margin: 18px auto 0;
        width: min(1180px, calc(100vw - 24px));
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(39, 30, 21, 0.18);
        background:
          linear-gradient(180deg, rgba(20, 14, 10, 0.15), rgba(20, 14, 10, 0.72)),
          radial-gradient(circle at 30% 20%, #c47a55 0%, transparent 42%),
          linear-gradient(135deg, #6d4332, #1d1612 55%, #3a2a22);
      }

      .cover-meta {
        position: absolute;
        left: 36px;
        right: 36px;
        bottom: 34px;
        color: #fff8f1;
      }

      .cover-kicker {
        margin: 0 0 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 12px;
        color: #f0c8b0;
      }

      .cover h1 {
        margin: 0;
        font-size: clamp(40px, 7vw, 72px);
        line-height: 0.98;
        letter-spacing: 0.06em;
        font-weight: 600;
      }

      .cover p {
        margin: 14px 0 0;
        max-width: 22em;
        font-size: 16px;
        line-height: 1.7;
        color: rgba(255, 248, 240, 0.84);
      }

      .cover-stats {
        margin-top: 18px;
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: rgba(255, 248, 240, 0.7);
      }

      .issue-bar {
        width: min(1180px, calc(100vw - 24px));
        margin: 22px auto 0;
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .issue-chip {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 11px 18px;
        white-space: nowrap;
        color: var(--ink);
      }

      .issue-chip.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .issue-chip small {
        opacity: 0.72;
        margin-left: 8px;
      }

      .series-note {
        width: min(1180px, calc(100vw - 24px));
        margin: 18px auto 0;
        padding: 18px 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 252, 245, 0.72);
        color: var(--muted);
        line-height: 1.7;
      }

      .grid {
        width: min(1180px, calc(100vw - 24px));
        margin: 22px auto 48px;
        column-count: 3;
        column-gap: 16px;
      }

      .card {
        break-inside: avoid;
        margin-bottom: 16px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #ddd3c6;
        position: relative;
        min-height: 180px;
      }

      .card.tall { min-height: 320px; }
      .card.mid { min-height: 240px; }

      .ph {
        width: 100%;
        height: 100%;
        min-height: inherit;
        display: grid;
        place-items: end start;
        padding: 16px;
        color: rgba(255, 248, 240, 0.9);
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .c1 { background: linear-gradient(160deg, #8b5a44, #2a1d18); }
      .c2 { background: linear-gradient(160deg, #6f7d6a, #1f2420); }
      .c3 { background: linear-gradient(160deg, #8a6d4d, #2c2118); }
      .c4 { background: linear-gradient(160deg, #6a4f62, #1d151c); }
      .c5 { background: linear-gradient(160deg, #4f6674, #152027); }
      .c6 { background: linear-gradient(160deg, #7a4f3f, #241612); }

      .foot {
        width: min(1180px, calc(100vw - 24px));
        margin: 0 auto 40px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.06em;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      @media (max-width: 860px) {
        .grid { column-count: 2; }
        .cover-meta { left: 22px; right: 22px; bottom: 22px; }
      }

      @media (max-width: 520px) {
        .grid { column-count: 1; }
      }
    </style>
  </head>
  <body>
    <div class="proto-bar">
      <strong>原型 01 · 封面特刊</strong>
      <nav>
        <a href="./01-cover-issue.html">01 封面</a>
        <a href="./02-editorial-wall.html">02 编辑墙</a>
        <a href="./03-immersive-reader.html">03 沉浸阅读</a>
        <a href="./index.html">总览</a>
      </nav>
    </div>

    <section class="cover" aria-label="本期封面">
      <div class="cover-meta">
        <p class="cover-kicker">Issue 07 · Gallery</p>
        <h1>图集</h1>
        <p>慢慢看，挑一份喜欢的气质。本期以侧光与冷调为主，适合夜色和留白。</p>
        <div class="cover-stats">
          <span>本期 36 张</span>
          <span>最近更新 · 3 天前</span>
          <span>系列 · 人像</span>
        </div>
      </div>
    </section>

    <div class="issue-bar" aria-label="系列导航">
      <button class="issue-chip active" type="button">人像 <small>24</small></button>
      <button class="issue-chip" type="button">风景 <small>12</small></button>
      <button class="issue-chip" type="button">静物 <small>9</small></button>
      <button class="issue-chip" type="button">街拍 <small>15</small></button>
    </div>

    <p class="series-note">
      <strong style="color: var(--ink); font-weight: 600;">人像</strong>
      · 偏冷调，强调轮廓与呼吸感。点击任意图片进入沉浸阅读。
    </p>

    <div class="grid" aria-hidden="true">
      <article class="card tall"><div class="ph c1">01</div></article>
      <article class="card mid"><div class="ph c2">02</div></article>
      <article class="card"><div class="ph c3">03</div></article>
      <article class="card mid"><div class="ph c4">04</div></article>
      <article class="card tall"><div class="ph c5">05</div></article>
      <article class="card"><div class="ph c6">06</div></article>
      <article class="card mid"><div class="ph c1">07</div></article>
      <article class="card"><div class="ph c2">08</div></article>
      <article class="card tall"><div class="ph c3">09</div></article>
    </div>

    <footer class="foot">
      <span>整理中的私人图集</span>
      <span>12 / 24 · 继续向下</span>
    </footer>
  </body>
</html>
