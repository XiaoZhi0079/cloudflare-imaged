<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图集</title>
    <link rel="stylesheet" href="/assets/main.css?v=20260717-centered-viewer-admin-modal" />
  </head>
  <body>
    <header class="public-nav"><div><a class="public-brand" href="/">Cloud Gallery</a><nav><a href="#albums">图集</a><a href="#browse">标签</a></nav></div></header>
    <div class="app-shell">
      <section class="editorial-intro"><p class="eyebrow">Personal Image Archive</p><h1>收藏你的视觉灵感。</h1><p>收藏偶然落下的光，也收藏那些无法复刻的瞬间。愿每一次凝望，都能重新听见当时的心跳。</p></section>
      <header class="hero hero-featured compact" id="site-hero">
        <div class="hero-stage" id="hero-stage" hidden>
          <img id="hero-image" class="hero-image" alt="" />
          <div class="hero-controls" id="hero-controls" hidden>
            <button type="button" id="hero-prev" aria-label="上一张">‹</button>
            <div class="hero-dots" id="hero-dots"></div>
            <button type="button" id="hero-pause" class="hero-pause" aria-pressed="false">暂停轮播</button>
            <button type="button" id="hero-next" aria-label="下一张">›</button>
          </div>
        </div>
        <div class="hero-meta">
          <p class="hero-issue" id="hero-issue"></p>
          <p class="hero-copy" id="hero-copy"></p>
        </div>
      </header>
      <section class="album-section" id="albums"><div class="section-heading"><p class="eyebrow">Albums</p></div><div id="album-list" class="album-grid"></div></section>
      <section id="browse" class="browse-section"><div class="section-heading"><p class="eyebrow">Browse</p></div><nav class="tag-strip" id="tag-strip" aria-label="标签导航"></nav></section>
      <main>
        <section class="gallery-grid" id="gallery-grid" aria-live="polite"></section>
      </main>
    </div>
    <div class="modal hidden" id="image-modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" type="button">&#x00D7;</button>
      <div class="modal-stage">
        <img id="modal-image" alt="" />
        <div class="modal-meta"><strong id="modal-title"></strong><span id="modal-tags"></span></div>
      </div>
    </div>
    <script type="module" src="/assets/gallery.js?v=20260717-centered-viewer-admin-modal"></script>
  </body>
</html>
