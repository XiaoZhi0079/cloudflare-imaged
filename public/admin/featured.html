<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery 图集管理</title>
    <link rel="stylesheet" href="/assets/admin/admin.css?v=20260721-admin-layout" />
    <link rel="stylesheet" href="/assets/admin/settings.css?v=20260721-admin-layout" />
  </head>
  <body class="admin-body" data-admin-page="featured">
    <section id="admin-auth-view" class="admin-auth-view" hidden>
      <form id="admin-login-form" class="admin-login-panel" novalidate>
        <p class="admin-eyebrow">Gallery Admin</p><h1>进入管理台</h1><p class="admin-muted">输入管理密钥后继续，此浏览器会记住登录状态。</p>
        <label class="admin-field" for="admin-key"><span>管理密钥</span><span class="admin-password-control"><input id="admin-key" type="password" autocomplete="current-password" required /><button type="button" data-toggle-password aria-label="显示管理密钥" title="显示管理密钥">显示</button></span></label>
        <p id="admin-login-error" class="admin-field-error" aria-live="polite"></p><button id="admin-login" class="admin-button-primary" type="submit">验证并进入</button>
      </form>
    </section>
    <div id="admin-app" hidden>
      <header class="admin-topbar"><a class="admin-brand" href="/admin/">Gallery 管理</a><nav class="admin-nav" aria-label="管理页面"><a href="/admin/">图片库</a><a class="is-active" href="/admin/featured.html">图集管理</a><a href="/admin/settings.html">标签与分类</a></nav><div class="admin-top-actions"><a href="/">查看前台</a><button type="button" data-admin-logout>退出</button></div></header>
      <main class="settings-page">
        <header class="settings-heading">
          <div><p class="admin-eyebrow">Albums</p><h1>图集管理</h1></div>
          <div class="site-featured-actions"><button id="featured-retry" type="button" hidden>重新加载</button><button id="album-create" data-action="create-album" class="admin-button-primary" type="button" disabled>新建图集</button></div>
        </header>
        <section id="album-panel" class="settings-panel album-manager">
          <aside id="album-list" class="album-list" aria-label="图集列表"></aside>
          <div class="album-editor">
            <div class="album-editor-grid">
              <label class="admin-field" for="album-name"><span>图集名字</span><input id="album-name" maxlength="60" disabled /></label>
              <label class="album-home-check"><input id="album-is-home" type="checkbox" disabled /><span>设为首页主图集</span></label>
              <label class="admin-field album-description-field" for="album-description"><span>图集介绍</span><textarea id="album-description" rows="4" maxlength="500" disabled></textarea></label>
              <label class="admin-field" for="album-cover"><span>图集封面</span><select id="album-cover" disabled></select></label>
            </div>
            <div class="site-featured-head"><div><h2>图集图片</h2><p id="album-status" class="admin-muted" aria-live="polite"></p></div><div class="site-featured-actions"><button id="album-add-images" data-action="add-images" type="button" disabled>从图片库添加</button><button id="album-delete" data-action="delete-album" class="admin-button-danger" type="button" disabled>删除图集</button><button id="album-save" data-action="save-album" class="admin-button-primary" type="button" disabled>保存</button></div></div>
            <div id="album-members" class="site-featured-list"></div>
          </div>
        </section>
      </main>
      <div id="admin-dialog-host"></div><div id="admin-toast-host" class="admin-toast-host" aria-live="polite"></div>
    </div>
    <script type="module" src="/assets/admin/featured-page.js?v=20260720-album-grid-preview"></script>
  </body>
</html>
