<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery 标签与分类管理</title>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body class="admin-body" data-admin-page="tags">
    <div class="app-shell admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">Gallery Admin</p>
          <h1>标签与分类管理</h1>
        </div>
        <div class="admin-topbar-actions">
          <a href="/" class="admin-gallery-link">查看前台</a>
        </div>
      </header>

      <nav class="admin-page-nav" aria-label="管理功能">
        <a class="admin-page-link" href="/admin/">概览</a>
        <a class="admin-page-link" href="/admin/upload.html">上传图片</a>
        <a class="admin-page-link is-active" href="/admin/tags.html">标签管理</a>
        <a class="admin-page-link" href="/admin/images.html">图片管理</a>
      </nav>

      <section class="admin-hero" aria-label="标签与分类概览">
        <div>
          <p class="admin-section-label">Taxonomy</p>
          <h2>管理公开展示的标签词表，以及上传目录使用的主分类。</h2>
        </div>
        <div id="admin-status" class="status-banner" data-state="info" aria-live="polite">请输入管理密钥后继续。</div>
      </section>

      <div class="admin-layout">
        <section id="admin-auth" class="panel admin-panel admin-auth-strip">
          <div class="panel-header compact-header">
            <div>
              <p class="admin-section-label">Access</p>
              <h2>身份验证</h2>
            </div>
          </div>
          <label class="field admin-auth-field">
            <span>管理密钥</span>
            <input id="admin-key" type="password" />
          </label>
          <button id="admin-connect" class="button-primary" type="button">进入后台</button>
          <div class="admin-note">验证后可编辑标签词表，并新增上传分类。</div>
        </section>

        <main class="admin-workspace">
          <section class="panel admin-panel admin-tags-panel admin-page-panel">
            <div class="panel-header compact-header">
              <div>
                <p class="admin-section-label">Taxonomy</p>
                <h2>标签词表</h2>
              </div>
            </div>
            <div class="admin-inline-form">
              <label class="field">
                <span>新标签</span>
                <input id="new-tag-name" type="text" disabled />
              </label>
              <button id="create-tag" class="button-secondary" type="button" disabled>新增</button>
            </div>
            <div id="tag-list" class="list-stack admin-list-stack"></div>
          </section>

          <section class="panel admin-panel admin-tags-panel admin-page-panel">
            <div class="panel-header compact-header">
              <div>
                <p class="admin-section-label">Category</p>
                <h2>分类管理</h2>
              </div>
            </div>
            <div class="admin-inline-form">
              <label class="field">
                <span>分类名称</span>
                <input id="new-category-name" type="text" disabled />
              </label>
              <label class="field">
                <span>英文目录</span>
                <input id="new-category-directory" type="text" disabled />
              </label>
              <button id="create-category" class="button-secondary" type="button" disabled>新增分类</button>
            </div>
            <div class="admin-note">英文目录创建后不可修改，建议使用小写英文和连字符。</div>
            <div id="category-list" class="list-stack admin-list-stack"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="admin-dialog" class="admin-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="admin-dialog-title">
      <div class="admin-dialog-panel">
        <div class="admin-dialog-header">
          <h2 id="admin-dialog-title"></h2>
          <button id="admin-dialog-close" class="button-ghost" type="button" aria-label="关闭">关闭</button>
        </div>
        <div id="admin-dialog-body" class="admin-dialog-body"></div>
        <div class="admin-dialog-actions">
          <button id="admin-dialog-cancel" class="button-secondary" type="button">取消</button>
          <button id="admin-dialog-confirm" class="button-primary" type="button">确认</button>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/admin.js"></script>
    <script type="module" src="/assets/admin-categories.js"></script>
  </body>
</html>
