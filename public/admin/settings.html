<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery 标签与分类</title>
    <link rel="stylesheet" href="/assets/admin/admin.css?v=20260721-admin-layout" />
    <link rel="stylesheet" href="/assets/admin/settings.css?v=20260722-directory-preview-fit" />
  </head>
  <body class="admin-body" data-admin-page="settings">
    <section id="admin-auth-view" class="admin-auth-view" data-auth-fallback="visible">
      <form id="admin-login-form" class="admin-login-panel" novalidate>
        <p class="admin-eyebrow">Gallery Admin</p><h1>进入管理台</h1><p class="admin-muted">输入管理密钥后继续，此浏览器会记住登录状态。</p>
        <label class="admin-field" for="admin-key"><span>管理密钥</span><span class="admin-password-control"><input id="admin-key" type="password" autocomplete="current-password" required /><button type="button" data-toggle-password aria-label="显示管理密钥" title="显示管理密钥">显示</button></span></label>
        <p id="admin-login-error" class="admin-field-error" aria-live="polite"></p><button id="admin-login" class="admin-button-primary" type="submit">验证并进入</button>
      </form>
    </section>
    <div id="admin-app" hidden>
      <header class="admin-topbar"><a class="admin-brand" href="/admin/">Gallery 管理</a><nav class="admin-nav" aria-label="管理页面"><a href="/admin/">图片库</a><a href="/admin/featured.html">图集管理</a><a class="is-active" href="/admin/settings.html">标签与分类</a></nav><div class="admin-top-actions"><a href="/">查看前台</a><button type="button" data-admin-logout>退出</button></div></header>
      <main class="settings-page">
        <header class="settings-heading">
          <div><p class="admin-eyebrow">Taxonomy</p><h1>标签与分类</h1></div>
          <div class="settings-heading-actions" aria-label="新增内容">
            <button id="tag-group-create" type="button"><span aria-hidden="true">+</span>新增标签分类</button>
            <button id="taxonomy-create" class="admin-button-primary" type="button"><span aria-hidden="true">+</span>新增标签</button>
            <button id="category-create" type="button"><span aria-hidden="true">+</span>新增目录</button>
          </div>
        </header>

        <div class="settings-overview" aria-label="内容统计">
          <div class="settings-overview-item"><span>目录</span><strong id="category-count">0</strong></div>
          <div class="settings-overview-item"><span>标签分类</span><strong id="tag-group-count">0</strong></div>
          <div class="settings-overview-item"><span>标签</span><strong id="tag-count">0</strong></div>
        </div>

        <div class="settings-filter-bar">
          <label class="settings-search-field" for="taxonomy-search"><span>搜索</span><input id="taxonomy-search" type="search" placeholder="搜索目录、标签分类或标签" /></label>
        </div>

        <section id="tag-taxonomy-panel" class="settings-taxonomy-section" aria-labelledby="tag-taxonomy-title">
          <header class="settings-taxonomy-section-heading">
            <div><p class="admin-eyebrow">Tags</p><h2 id="tag-taxonomy-title">标签体系</h2></div>
            <div class="settings-order-actions">
              <button id="tag-taxonomy-reset-order" type="button" disabled>取消排序</button>
              <button id="tag-taxonomy-save-order" class="admin-button-primary" type="button" disabled>保存排序</button>
            </div>
          </header>
          <p id="tag-taxonomy-status" class="settings-status" aria-live="polite"></p>
          <div id="tag-taxonomy-list" class="taxonomy-list"></div>
        </section>

        <section id="category-taxonomy-panel" class="settings-taxonomy-section" aria-labelledby="category-taxonomy-title">
          <header class="settings-taxonomy-section-heading">
            <div><p class="admin-eyebrow">Directories</p><h2 id="category-taxonomy-title">目录</h2></div>
            <div class="settings-order-actions">
              <button id="category-taxonomy-reset-order" type="button" disabled>取消排序</button>
              <button id="category-taxonomy-save-order" class="admin-button-primary" type="button" disabled>保存排序</button>
            </div>
          </header>
          <p id="category-taxonomy-status" class="settings-status" aria-live="polite"></p>
          <div id="category-taxonomy-list" class="taxonomy-list"></div>
        </section>
      </main>
      <div id="admin-dialog-host"></div><div id="admin-toast-host" class="admin-toast-host" aria-live="polite"></div>
    </div>
    <script type="module" src="/assets/admin/settings-page.js?v=20260722-directory-preview-fit"></script>
  </body>
</html>
