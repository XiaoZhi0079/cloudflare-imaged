<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery 图片工作台</title>
    <link rel="stylesheet" href="/assets/admin/admin.css?v=20260721-admin-layout" />
    <link rel="stylesheet" href="/assets/admin/workbench.css?v=20260722-dialog-layer" />
  </head>
  <body class="admin-body" data-admin-page="library">
    <section id="admin-auth-view" class="admin-auth-view" data-auth-fallback="visible">
      <form id="admin-login-form" class="admin-login-panel" novalidate>
        <p class="admin-eyebrow">Gallery Admin</p>
        <h1>进入管理台</h1>
        <p class="admin-muted">输入管理密钥后继续，此浏览器会记住登录状态。</p>
        <label class="admin-field" for="admin-key"><span>管理密钥</span><span class="admin-password-control"><input id="admin-key" type="password" autocomplete="current-password" required /><button type="button" data-toggle-password aria-label="显示管理密钥" title="显示管理密钥">显示</button></span></label>
        <p id="admin-login-error" class="admin-field-error" aria-live="polite"></p>
        <button id="admin-login" class="admin-button-primary" type="submit">验证并进入</button>
      </form>
    </section>

    <div id="admin-app" hidden>
      <header class="admin-topbar">
        <a class="admin-brand" href="/admin/">Gallery 管理</a>
        <nav class="admin-nav" aria-label="管理页面"><a class="is-active" href="/admin/">图片库</a><a href="/admin/featured.html">图集管理</a><a href="/admin/settings.html">标签与分类</a></nav>
        <div class="admin-top-actions"><a href="/">查看前台</a><button type="button" data-admin-logout>退出</button></div>
      </header>
      <main class="workbench">
        <header class="workbench-heading"><div><p class="admin-eyebrow">Library</p><h1>图片库 <span id="admin-visible-count">0</span></h1></div><div class="workbench-heading-actions"><button id="admin-bulk-toggle" type="button" aria-pressed="false">批量管理</button><button id="admin-upload-open" class="admin-button-primary" type="button">上传图片</button></div></header>
        <section class="workbench-command" aria-label="搜索和排序"><label class="admin-field"><span>搜索图片</span><input id="admin-search" type="search" placeholder="文件名或标签" /></label><label class="admin-field"><span>排序</span><select id="admin-sort"><option value="newest">最新上传</option><option value="name">文件名</option></select></label><button id="admin-filter-toggle" type="button" aria-expanded="false" aria-controls="admin-filters">筛选</button><button id="admin-density" type="button" aria-pressed="false">紧凑视图</button></section>
        <div class="workbench-layout">
          <aside id="admin-filters" class="filter-rail">
            <div class="filter-head"><h2>筛选</h2><button id="admin-clear-filters" type="button">清空</button></div>
            <section><h3 class="filter-section-heading"><span>标签（全部匹配）</span><span id="tag-filter-selected-count">已选 0</span></h3><input id="tag-filter-search" type="search" aria-label="搜索标签" placeholder="搜索标签" /><div id="tag-filter-list"></div></section>
          </aside>
          <section class="image-library"><div id="image-list" class="admin-image-grid" aria-live="polite"></div><button id="admin-load-more" type="button" hidden>继续显示</button></section>
        </div>
      </main>
      <section id="admin-bulk-toolbar" class="admin-bulk-toolbar" hidden><strong id="bulk-selected-count">已选择 0 张</strong><div><button id="bulk-assign-tags" type="button" disabled>设置标签</button><button id="bulk-assign-category" type="button" disabled>移动目录</button><button id="bulk-delete" class="admin-button-danger" type="button" disabled>删除</button><button id="bulk-clear-selection" type="button">完成</button></div></section>
      <section id="admin-upload-dialog" class="admin-overlay" hidden aria-label="上传图片"></section>
      <section id="admin-upload-status" class="admin-upload-status" hidden aria-label="后台上传任务"></section>
      <section id="admin-detail-overlay" class="admin-overlay admin-detail-overlay" hidden></section>
      <div id="admin-dialog-host"></div><div id="admin-toast-host" class="admin-toast-host" aria-live="polite"></div>
    </div>
    <script type="module" src="/assets/admin/library-page.js?v=20260727-image-identity"></script>
  </body>
</html>
