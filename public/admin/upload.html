<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery 上传管理</title>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body class="admin-body" data-admin-page="upload">
    <div class="app-shell admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">Gallery Admin</p>
          <h1>上传图片</h1>
        </div>
        <div class="admin-topbar-actions">
          <a href="/" class="admin-gallery-link">查看前台</a>
        </div>
      </header>

      <nav class="admin-page-nav" aria-label="管理功能">
        <a class="admin-page-link" href="/admin/">概览</a>
        <a class="admin-page-link is-active" href="/admin/upload.html">上传图片</a>
        <a class="admin-page-link" href="/admin/tags.html">标签管理</a>
        <a class="admin-page-link" href="/admin/images.html">图片管理</a>
      </nav>

      <section class="admin-hero" aria-label="上传概览">
        <div>
          <p class="admin-section-label">Upload</p>
          <h2>选择图片、主分类和标签后开始上传。</h2>
        </div>
        <div id="admin-status" class="status-banner" data-state="info" aria-live="polite">请输入管理密钥后继续。</div>
      </section>

      <div class="admin-layout">
        <section id="admin-auth" class="panel admin-panel admin-auth-strip">
          <div class="panel-header compact-header">
            <div>
              <p class="admin-section-label">Access</p>
              <h2>身份验证</h2>
            </div>
          </div>
          <label class="field admin-auth-field">
            <span>管理密钥</span>
            <input id="admin-key" type="password" />
          </label>
          <button id="admin-connect" class="button-primary" type="button">进入后台</button>
          <div class="admin-note">连接后会自动读取可用标签和分类。</div>
        </section>

        <main class="admin-workspace">
          <section class="panel admin-panel admin-upload-panel admin-page-panel">
            <div class="panel-header">
              <div>
                <p class="admin-section-label">Upload</p>
                <h2>上传图片</h2>
              </div>
              <button id="upload-submit" class="button-primary" type="button" disabled>上传并打标签</button>
            </div>
            <div class="upload-grid admin-upload-grid">
              <label class="field admin-file-field">
                <span>选择图片</span>
                <input id="upload-files" type="file" accept="image/*" multiple disabled />
              </label>
              <label class="field admin-category-field">
                <span>主分类</span>
                <select id="upload-category" disabled>
                  <option value="">请先完成验证</option>
                </select>
              </label>
              <div class="field admin-tag-field">
                <span>上传时绑定标签</span>
                <div id="upload-tag-options" class="check-grid"></div>
              </div>
            </div>
            <div id="upload-summary" class="list-item admin-upload-summary">尚未选择图片。</div>
          </section>
        </main>
      </div>
    </div>

    <div id="admin-dialog" class="admin-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="admin-dialog-title">
      <div class="admin-dialog-panel">
        <div class="admin-dialog-header">
          <h2 id="admin-dialog-title"></h2>
          <button id="admin-dialog-close" class="button-ghost" type="button" aria-label="关闭">关闭</button>
        </div>
        <div id="admin-dialog-body" class="admin-dialog-body"></div>
        <div class="admin-dialog-actions">
          <button id="admin-dialog-cancel" class="button-secondary" type="button">取消</button>
          <button id="admin-dialog-confirm" class="button-primary" type="button">确认</button>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/admin.js"></script>
    <script type="module" src="/assets/admin-categories.js"></script>
  </body>
</html>
