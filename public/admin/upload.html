<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery &#x4E0A;&#x4F20;&#x7BA1;&#x7406;</title>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body class="admin-body" data-admin-page="upload">
    <div class="app-shell admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="admin-kicker">Gallery Admin</p>
          <h1>&#x4E0A;&#x4F20;&#x56FE;&#x7247;</h1>
        </div>
        <div class="admin-topbar-actions">
          <a href="/" class="admin-gallery-link">&#x67E5;&#x770B;&#x524D;&#x53F0;</a>
        </div>
      </header>

      <nav class="admin-page-nav" aria-label="&#x7BA1;&#x7406;&#x529F;&#x80FD;">
        <a class="admin-page-link" href="/admin/">&#x6982;&#x89C8;</a>
        <a class="admin-page-link is-active" href="/admin/upload.html">&#x4E0A;&#x4F20;&#x56FE;&#x7247;</a>
        <a class="admin-page-link" href="/admin/tags.html">&#x6807;&#x7B7E;&#x7BA1;&#x7406;</a>
        <a class="admin-page-link" href="/admin/images.html">&#x56FE;&#x7247;&#x7BA1;&#x7406;</a>
      </nav>

      <section class="admin-hero" aria-label="&#x4E0A;&#x4F20;&#x6982;&#x89C8;">
        <div>
          <p class="admin-section-label">Upload</p>
          <h2>&#x9009;&#x62E9;&#x56FE;&#x7247;&#x5E76;&#x5728;&#x4E0A;&#x4F20;&#x65F6;&#x7ED1;&#x5B9A;&#x6807;&#x7B7E;&#x3002;</h2>
        </div>
        <div id="admin-status" class="status-banner" data-state="info" aria-live="polite">&#x8BF7;&#x8F93;&#x5165;&#x7BA1;&#x7406;&#x5BC6;&#x94A5;&#x540E;&#x7EE7;&#x7EED;&#x3002;</div>
      </section>

      <div class="admin-layout">
        <section id="admin-auth" class="panel admin-panel admin-auth-strip">
          <div class="panel-header compact-header">
            <div>
              <p class="admin-section-label">Access</p>
              <h2>&#x8EAB;&#x4EFD;&#x9A8C;&#x8BC1;</h2>
            </div>
          </div>
          <label class="field admin-auth-field">
            <span>&#x7BA1;&#x7406;&#x5BC6;&#x94A5;</span>
            <input id="admin-key" type="password" />
          </label>
          <button id="admin-connect" class="button-primary" type="button">&#x8FDB;&#x5165;&#x540E;&#x53F0;</button>
          <div class="admin-note">&#x8FDE;&#x63A5;&#x540E;&#x4F1A;&#x81EA;&#x52A8;&#x8BFB;&#x53D6;&#x53EF;&#x7528;&#x6807;&#x7B7E;&#x3002;</div>
        </section>

        <main class="admin-workspace">
          <section class="panel admin-panel admin-upload-panel admin-page-panel">
            <div class="panel-header">
              <div>
                <p class="admin-section-label">Upload</p>
                <h2>&#x4E0A;&#x4F20;&#x56FE;&#x7247;</h2>
              </div>
              <button id="upload-submit" class="button-primary" type="button" disabled>&#x4E0A;&#x4F20;&#x5E76;&#x6253;&#x6807;&#x7B7E;</button>
            </div>
            <div class="upload-grid admin-upload-grid">
              <label class="field admin-file-field">
                <span>&#x9009;&#x62E9;&#x56FE;&#x7247;</span>
                <input id="upload-files" type="file" accept="image/*" multiple disabled />
              </label>
              <div class="field admin-tag-field">
                <span>&#x4E0A;&#x4F20;&#x65F6;&#x7ED1;&#x5B9A;&#x6807;&#x7B7E;</span>
                <div id="upload-tag-options" class="check-grid"></div>
              </div>
            </div>
            <div id="upload-summary" class="list-item admin-upload-summary">&#x5C1A;&#x672A;&#x9009;&#x62E9;&#x56FE;&#x7247;&#x3002;</div>
          </section>
        </main>
      </div>
    </div>

    <div id="admin-dialog" class="admin-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="admin-dialog-title">
      <div class="admin-dialog-panel">
        <div class="admin-dialog-header">
          <h2 id="admin-dialog-title"></h2>
          <button id="admin-dialog-close" class="button-ghost" type="button" aria-label="&#x5173;&#x95ED;">&#x5173;&#x95ED;</button>
        </div>
        <div id="admin-dialog-body" class="admin-dialog-body"></div>
        <div class="admin-dialog-actions">
          <button id="admin-dialog-cancel" class="button-secondary" type="button">&#x53D6;&#x6D88;</button>
          <button id="admin-dialog-confirm" class="button-primary" type="button">&#x786E;&#x8BA4;</button>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/admin.js"></script>
  </body>
</html>
